# The off-machine copy, added as a drop-in rather than as a line in
# engram-backup.service: re-copying the shipped unit (after a `git pull` that
# changed it) then cannot quietly drop the upload step.
#
#   sudo install -d /etc/systemd/system/engram-backup.service.d
#   sudo cp deploy/engram-backup.service.d/upload.conf /etc/systemd/system/engram-backup.service.d/
#   sudo systemctl daemon-reload
[Service]
# ENGRAM_BACKUP_REMOTE, ENGRAM_BACKUP_KEEP_REMOTE, ENGRAM_BACKUP_KEEP_MONTHLY,
# RCLONE_CONFIG. Root-only (0600). The leading "-" makes it optional: unset,
# the script's defaults apply.
EnvironmentFile=-/etc/engram/backup.env
ExecStart=/opt/engram/server/deploy/backup-upload.sh
