# The deployment is this one file. No systemd unit, no nginx, no virtualenv.
#
# db publishes no port — only app sees it, inside the compose network. Exactly
# one thing is exposed: app's 8081. Even bulk imports arrive over that port
# (POST /api/index), so the server needs neither documents on disk nor git
# credentials.
name: engram

services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Sized for the machine this actually lands on. A store like this is a
    # second service on a box that already runs something else — typically the
    # cheapest VPS tier, 1 vCPU and 2GB — and Postgres's defaults assume the
    # box is its own. Unbounded, an import or a wide query can take the whole
    # machine down, and the process the OOM killer picks is not necessarily
    # this one: the neighbour dies and engram looks innocent.
    #
    # Raise both on a real database host; ENGRAM_DB_MEMORY=2g is reasonable
    # when nothing else is competing.
    deploy:
      resources:
        limits:
          memory: ${ENGRAM_DB_MEMORY:-512m}
    command:
      - postgres
      # 25% of the container limit, the usual starting point.
      - -c
      - shared_buffers=${ENGRAM_DB_SHARED_BUFFERS:-128MB}
      # The default 100 is the real hazard: worst-case memory is roughly
      # max_connections * work_mem, and the client count here is people, not a
      # web tier. Fifty is already generous.
      - -c
      - max_connections=${ENGRAM_DB_MAX_CONNECTIONS:-50}
      - -c
      - work_mem=${ENGRAM_DB_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${ENGRAM_DB_MAINTENANCE_WORK_MEM:-64MB}
      # What the planner believes the OS will cache. Too high on a shared box
      # makes it pick index scans that then hit disk.
      - -c
      - effective_cache_size=${ENGRAM_DB_EFFECTIVE_CACHE_SIZE:-384MB}
    environment:
      POSTGRES_USER: engram
      POSTGRES_DB: engram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Pin collation so sorting and comparison do not shift with the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # Revision timestamps are rendered in this zone. They are stored as
      # timestamptz so the value is the same either way, but a UTC display means
      # converting "when did this change" in your head every time.
      TZ: ${ENGRAM_TZ:-UTC}
      PGTZ: ${ENGRAM_TZ:-UTC}
    volumes:
      # A bind mount rather than a named volume — pg_dump and looking at the
      # actual files then do not have to go through docker.
      - ${ENGRAM_DATA:-./data}/pgdata:/var/lib/postgresql/data
    # Docker's default is unbounded log growth. Changing the daemon-wide setting
    # would affect every other container on the machine, so it is set per service.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: engram-store
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${ENGRAM_APP_MEMORY:-384m}
    environment:
      ENGRAM_DSN: postgresql://engram:${POSTGRES_PASSWORD}@db:5432/engram
      # The store's one credential; it refuses to start without it.
      ENGRAM_TOKEN: ${ENGRAM_TOKEN:?set ENGRAM_TOKEN in .env}
      # Groups not listed here are refused on write. This line is the boundary
      # that keeps the wrong repos out. Empty means nothing can be written — a
      # deployment that forgot to configure it closes rather than opens.
      ENGRAM_OWNERS: ${ENGRAM_OWNERS:-}
      # Serve reads without a token. Off unless asked for -- the default has
      # to be the one that is safe on the network the software cannot see.
      ENGRAM_PUBLIC_READS: ${ENGRAM_PUBLIC_READS:-false}
      ENGRAM_TZ: ${ENGRAM_TZ:-UTC}
      TZ: ${ENGRAM_TZ:-UTC}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # ENGRAM_BIND is which of the host's addresses the port is published on.
    # The default, every address, is right for the plaintext deployment on a
    # trusted network. When something else terminates TLS in front of the app —
    # the caddy service below, or a reverse proxy this host already runs — it
    # is set to the loopback address (or the docker bridge, for a proxy that is
    # itself a container), so that the plaintext port is reachable only from
    # this machine. Leaving it on every address beside the encrypted one would
    # be a hole that behaves exactly like the fix: a client pointed at the plain
    # port works perfectly while sending the token in the clear.
    ports:
      - "${ENGRAM_BIND:-0.0.0.0}:${ENGRAM_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy

  # TLS. Off unless asked for. setup.sh --tls turns it on by writing
  # COMPOSE_PROFILES=tls into .env, after which a plain `docker compose up -d`
  # includes this service — the profile is a property of the deployment, not
  # something to remember on every command.
  #
  # Not on by default because it cannot be. A certificate is issued to a NAME
  # that a public CA can reach, and a store on a LAN at 192.168.1.10 has none —
  # so a default-on TLS would fail to start for exactly the deployment the
  # plaintext default is right for. Whether the network in between is one to
  # trust is a judgement the deployer makes; server/README.md lays out the
  # paths for the cases where it is not.
  #
  # The name does not have to be bought. ENGRAM_DOMAIN accepts anything that
  # resolves to this host, and setup.sh defaults it to <public-ip>.sslip.io,
  # a public resolver that maps an IP-shaped name back to that IP. Let's
  # Encrypt issues for it like any other name, so TLS costs a flag rather than
  # a domain registration.
  #
  # If this host already runs a reverse proxy — one holding :80 and :443 — this
  # profile cannot bind them and must not be used. Point that proxy at the
  # app's published port instead; server/README.md has the site block.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      # Not `${ENGRAM_DOMAIN:?}`: compose interpolates every service's variables
      # even for a profile that is off, so a required marker here would stop
      # the plaintext deployment from starting. The requirement is enforced
      # where it applies — inside this container, when it actually runs.
      ENGRAM_DOMAIN: ${ENGRAM_DOMAIN:-}
    # Written inline rather than as a file so that turning TLS on adds nothing
    # to the directory: one flag, one variable, no second thing to keep in sync
    # with the compose file. Caddy obtains and renews the certificate itself.
    command: >
      sh -c '[ -n "$$ENGRAM_DOMAIN" ] || { echo "engram: the tls profile needs ENGRAM_DOMAIN (a name that resolves to this host)" >&2; exit 1; };
      printf "%s {\n  reverse_proxy app:8081\n}\n" "$$ENGRAM_DOMAIN"
      > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile'
    ports:
      # 80 is not optional: it is how the ACME HTTP challenge and the
      # redirect-to-HTTPS both work.
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and account keys. Losing this directory means re-issuing
      # on the next start, which Let's Encrypt rate-limits — so it is a bind
      # mount next to the database's, not an anonymous volume.
      - ${ENGRAM_DATA:-./data}/caddy:/data
      - ${ENGRAM_DATA:-./data}/caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    depends_on:
      - app
