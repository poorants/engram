name: release

# Tag a version and the binaries appear on the release page. That is the whole
# distribution story: install.sh downloads one file from here, so nobody needs
# Go, a clone, or a build to run engram.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build artifacts
        run: make dist VERSION=${{ github.ref_name }}
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Set up a machine

            A session reaches the brain only through the remote MCP server
            (`engram serve`, next to the store). Register it once per machine:

            ```bash
            claude mcp add --transport http --scope user --callback-port 33418 engram https://<host>/mcp
            ```

            Then `/mcp` → engram → Authenticate, and run `/mcp__engram__setup` in
            Claude Code: it installs the plugin (skill + capture hooks) and the
            `engram` binary the hooks run. The binary alone:

            **Linux · macOS**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **Windows**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            ## No store yet?

            The store is Postgres in Docker — Linux or macOS, once, for everyone:
            see [server/README.md](https://github.com/${{ github.repository }}/blob/main/server/README.md).

            Checksums for every asset are in `SHA256SUMS`; both installers verify
            against it and refuse to install on a mismatch.

  # Install the release that was just published, the way a stranger would, on
  # each OS the client claims to support.
  #
  # The failure this exists to catch: `make dist` and the installers agree on
  # the asset filename in two separate places, and nothing else compares them.
  # Rename a target or add an architecture and the release still builds, still
  # uploads, and still looks finished — and every install one-liner in the
  # README fails with "could not download", for everyone, until someone reports
  # it. Checking it here costs a minute per release.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install it the way the README says
        if: runner.os != 'Windows'
        run: |
          sh install.sh --version "$GITHUB_REF_NAME" --dir "$HOME/engram-smoke"
          "$HOME/engram-smoke/engram" version
          # Installing the same version again is a no-op, not a second download.
          again=$(sh install.sh --version "$GITHUB_REF_NAME" --dir "$HOME/engram-smoke")
          case "$again" in *"already installed"*) ;; *) echo "$again"; exit 1 ;; esac
          # The hook must answer, and answer with exit 0, whatever it is fed.
          echo '{}' | "$HOME/engram-smoke/engram" hook

      - name: install it the way the README says
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ENGRAM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'engram-smoke'
          ./install.ps1 -Version $env:GITHUB_REF_NAME
          $exe = Join-Path $env:ENGRAM_INSTALL_DIR 'engram.exe'
          & $exe version
          '{}' | & $exe hook
          if ($LASTEXITCODE -ne 0) { exit 1 }
