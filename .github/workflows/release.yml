name: release

# Tag a version and the binaries appear on the release page. That is the whole
# distribution story: install.sh downloads one file from here, so nobody needs
# Go, a clone, or a build to run engram.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build artifacts
        run: make dist VERSION=${{ github.ref_name }}
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install the client

            Binary, MCP server, skill and capture hooks — one command. Paste the
            store address and token that `server/setup.sh` printed.

            **Linux · macOS**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh \
              | sh -s -- --store http://<host>:8081 --token <write token>
            ```

            **Windows**
            ```powershell
            $env:ENGRAM_STORE_URL = 'http://<host>:8081'
            $env:ENGRAM_TOKEN     = '<write token>'
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            Run either with no arguments to install the binary alone.

            ## No store yet?

            The store is Postgres in Docker — Linux or macOS, once, for everyone:

            ```bash
            git clone https://github.com/${{ github.repository }} && cd engram/server
            ./setup.sh --owners <your-github-org>
            ```

            Checksums for every asset are in `SHA256SUMS`; both installers verify
            against it and refuse to install on a mismatch.

  # Install the release that was just published, the way a stranger would, on
  # each OS the client claims to support.
  #
  # The failure this exists to catch: `make dist` and the installers agree on
  # the asset filename in two separate places, and nothing else compares them.
  # Rename a target or add an architecture and the release still builds, still
  # uploads, and still looks finished — and every install one-liner in the
  # README fails with "could not download", for everyone, until someone reports
  # it. Checking it here costs a minute per release.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install it the way the README says
        if: runner.os != 'Windows'
        run: |
          sh install.sh --version "$GITHUB_REF_NAME" --no-claude --dir "$HOME/engram-smoke"
          "$HOME/engram-smoke/engram" version
          # The installer is allowed to leave the store unconfigured; it is not
          # allowed to leave a binary that cannot answer.
          "$HOME/engram-smoke/engram" store show

      - name: install it the way the README says
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ENGRAM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'engram-smoke'
          ./install.ps1 -Version $env:GITHUB_REF_NAME -NoClaude
          $exe = Join-Path $env:ENGRAM_INSTALL_DIR 'engram.exe'
          & $exe version
          & $exe store show
