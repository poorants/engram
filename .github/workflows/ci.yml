name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -race
      - name: build every release target
        run: |
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null ./cmd/engram
          done

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install server dependencies
        run: pip install -r server/requirements-dev.txt
      - name: server unit tests (no database needed)
        run: python -m pytest server/tests -q

  # The plugin declares its hook as a command line, and nothing else checks that
  # the binary actually implements the verb it names. Getting that wrong is not a
  # quiet failure: an unknown command puts an error in front of the user on every
  # single prompt.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: the plugin manifest must be valid JSON
        run: jq -e . .claude-plugin/marketplace.json > /dev/null
      - name: the skill ships no scripts
        run: |
          if [ -e skills/engram/scripts ]; then
            echo "skills/engram/scripts is back — the skill must stay interpreter-free"
            exit 1
          fi
      - name: every hook goes through the launcher and names a verb this binary implements
        # Since 0.15.0 a hook is `git -C <root> -c alias.engram-launch=!sh <root>/bin/engram-launch
        # engram-launch <verb>` (so Windows runs the POSIX launcher too). The launcher execs
        # `engram <verb>`, so the verb is what must exist.
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/engram" ./cmd/engram
          jq -c '[.plugins[].hooks // {} | to_entries[] | .value[].hooks[]] | unique[]' \
            .claude-plugin/marketplace.json > "$RUNNER_TEMP/hooks"
          test -s "$RUNNER_TEMP/hooks"
          while read -r h; do
            echo "checking: $h"
            [ "$(printf '%s' "$h" | jq -r .command)" = git ] || { echo "a hook must run git (the launcher alias), got: $h"; exit 1; }
            printf '%s' "$h" | jq -e '.args | any(test("^alias\\.engram-launch=!sh .*/bin/engram-launch\""))' > /dev/null \
              || { echo "the hook does not define the engram-launch alias to bin/engram-launch: $h"; exit 1; }
            # The verb is the first non-flag argument after `engram-launch` (launcher flags such as
            # --no-update come first).
            verb=$(printf '%s' "$h" | jq -r '.args | (index("engram-launch") // error("no engram-launch")) as $i | .[$i+1:] | map(select(startswith("-") | not)) | .[0] // empty') \
              || { echo "the hook must invoke engram-launch: $h"; exit 1; }
            [ -n "$verb" ] || { echo "the hook names no verb: $h"; exit 1; }
            if ! "$RUNNER_TEMP/engram" "$verb" < /dev/null > /dev/null 2>&1; then
              echo "the binary does not implement the hook verb: $verb"
              exit 1
            fi
          done < "$RUNNER_TEMP/hooks"
          test -f bin/engram-launch

  # The installers are the first thing a stranger runs, and nothing else in this
  # repository exercises them. A syntax error here is invisible until it is in
  # somebody's terminal.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: posix syntax
        run: |
          for f in install.sh server/setup.sh server/deploy/backup.sh; do
            sh -n "$f" || exit 1
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh install.sh server/setup.sh
      # The backup scripts run unattended at night; a syntax error there is a
      # backup that silently stops. They are bash (process substitution, <<<).
      - name: backup scripts
        run: |
          for f in server/deploy/backup-upload.sh server/deploy/restore-rehearsal.sh; do
            bash -n "$f" || exit 1
          done
          shellcheck -s bash server/deploy/backup-upload.sh server/deploy/restore-rehearsal.sh
      - name: the help text must render without a release
        run: sh install.sh --help && sh server/setup.sh --help
      - name: powershell syntax
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
